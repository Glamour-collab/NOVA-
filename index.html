<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>NOVAÉ | تواصل معنا</title>
  <meta name="description" content="تواصل معنا مباشرة عبر واتساب">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0
    }

    html,body{
      width:100%;
      min-height:100%
    }

    body{
      font-family:Arial,Tahoma,sans-serif;
      background:radial-gradient(
        circle at 50% 35%,
        #102c3a 0%,
        #071722 38%,
        #041019 75%
      );
      color:#fff;
      overflow-x:hidden;
      -webkit-tap-highlight-color:transparent
    }

    .page{
      min-height:100vh;
      min-height:100svh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:42px 20px 105px;
      position:relative
    }

    .brand{
      text-align:center;
      margin-top:10px
    }

    .brand-name{
      font-size:27px;
      font-weight:800;
      letter-spacing:2px;
      color:#fff
    }

    .brand-name span{
      color:#25D366
    }

    .brand-line{
      width:38px;
      height:3px;
      margin:9px auto 0;
      border-radius:20px;
      background:#25D366;
      box-shadow:0 0 14px rgba(37,211,102,.45)
    }

    .subtitle{
      margin-top:14px;
      color:#aebfc7;
      font-size:14px;
      line-height:1.8;
      text-align:center
    }

    .contact-area{
      width:100%;
      max-width:430px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      flex:1;
      min-height:420px
    }

    .main-title{
      font-size:23px;
      font-weight:700;
      text-align:center;
      margin-bottom:27px;
      color:#f5f9fa
    }

    /* =========================
       الزر الأوسط Premium
       ========================= */

    .whatsapp-main{
      width:128px;
      height:128px;
      position:relative;
      border:1px solid rgba(37,211,102,.55);
      border-radius:50%;

      background:
        radial-gradient(
          circle at 35% 28%,
          rgba(255,255,255,.18) 0%,
          rgba(255,255,255,.04) 24%,
          transparent 42%
        ),
        linear-gradient(
          145deg,
          #31e875 0%,
          #25D366 48%,
          #149a49 100%
        );

      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;

      box-shadow:
        0 10px 24px rgba(0,0,0,.30),
        0 0 0 7px rgba(37,211,102,.055),
        0 0 0 12px rgba(37,211,102,.025),
        0 0 28px rgba(37,211,102,.20),
        inset 0 2px 4px rgba(255,255,255,.30),
        inset 0 -5px 10px rgba(0,0,0,.16);

      transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease
    }

    /* الحلقة الخارجية */
    .whatsapp-main::before{
      content:"";
      position:absolute;
      inset:-5px;
      border-radius:50%;
      border:1px solid rgba(37,211,102,.25);
      pointer-events:none
    }

    /* اللمعة الداخلية */
    .whatsapp-main::after{
      content:"";
      position:absolute;
      width:72px;
      height:34px;
      top:15px;
      left:28px;
      border-radius:50%;
      background:rgba(255,255,255,.10);
      filter:blur(8px);
      transform:rotate(-25deg);
      pointer-events:none
    }

    .whatsapp-main .wa-icon{
      width:54px;
      height:54px;
      flex-shrink:0;
      position:relative;
      z-index:2;
      filter:
        drop-shadow(0 3px 5px rgba(0,0,0,.18))
        drop-shadow(0 0 5px rgba(255,255,255,.12))
    }

    /* تأثير الضغط */
    .whatsapp-main:active{
      transform:scale(.95);

      background:
        radial-gradient(
          circle at 35% 28%,
          rgba(255,255,255,.10) 0%,
          transparent 40%
        ),
        linear-gradient(
          145deg,
          #20bd59,
          #119b49
        );

      box-shadow:
        0 5px 12px rgba(0,0,0,.28),
        0 0 0 6px rgba(37,211,102,.045),
        0 0 18px rgba(37,211,102,.14),
        inset 0 3px 7px rgba(0,0,0,.16)
    }

    .under-text{
      margin-top:17px;
      color:#a9bac1;
      font-size:14px;
      text-align:center
    }

    /* =========================
       الشريط السفلي
       ========================= */

    .bottom-bar{
      position:fixed;
      z-index:100;
      left:12px;
      right:12px;
      bottom:max(12px,env(safe-area-inset-bottom));
      height:67px;
      border-radius:17px;
      background:linear-gradient(
        145deg,
        rgba(13,39,49,.99),
        rgba(5,23,32,.99)
      );
      border:1px solid rgba(37,211,102,.42);
      box-shadow:
        0 12px 30px rgba(0,0,0,.42),
        0 0 15px rgba(37,211,102,.08),
        inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px)
    }

    .bottom-link{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:11px;
      text-decoration:none;
      color:#fff;
      font-size:17px;
      font-weight:700;
      border-radius:17px;
      transition:
        background .15s ease,
        transform .15s ease
    }

    .bottom-link:active{
      transform:scale(.98);
      background:#075e38;
      color:#fff
    }

    .bottom-link .wa-icon{
      width:28px;
      height:28px
    }

    .footer{
      position:absolute;
      bottom:93px;
      color:#647981;
      font-size:11px;
      text-align:center
    }

    @media(max-width:380px){
      .page{
        padding-top:30px
      }

      .brand-name{
        font-size:24px
      }

      .main-title{
        font-size:20px
      }

      .whatsapp-main{
        width:120px;
        height:120px
      }
    }
  </style>

  <!-- TikTok Events Tracking -->
  <script>
  function trackWhatsAppEvents(event) {
    if (event) {
      event.preventDefault();
    }

    /* إرسال حدث InitiateCheckout */
    ttq.track('InitiateCheckout', {
      content_id: 'NOVAÉ_WHATSAPP'
    });

    /* إرسال حدث Contact */
    ttq.track('Contact');

    const whatsappURL = this.href;

    /* التأخير الذكي لنقل البيانات قبل التوجيه */
    setTimeout(function () {
      window.location.href = whatsappURL;
    }, 180);
  }

  document.addEventListener('DOMContentLoaded', function () {
    const whatsappButtons = document.querySelectorAll('#whatsappButton, .bottom-link');

    whatsappButtons.forEach(function (button) {
      button.addEventListener('click', trackWhatsAppEvents);
    });
  });
  </script>
